name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: 'Git ref to publish (tag, branch, or SHA). Defaults to the triggering ref.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Resolve publish ref
        id: publish_ref
        shell: bash
        run: |
          ref="${{ github.event.inputs.publish_ref }}"
          if [ -z "$ref" ]; then
            ref="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$ref" ]; then
            ref="${{ github.ref }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing ref: $ref"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.publish_ref.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          {
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          existing=$(npm view "$PKG_NAME" version || true)
          if [ "$existing" = "$PKG_VERSION" ]; then
            echo "Version $PKG_VERSION already published to npm. Skipping."
          elif [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing $PKG_NAME@$PKG_VERSION with NPM_TOKEN."
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public
          else
            echo "NPM_TOKEN not configured; attempting npm trusted publishing via OIDC."
            echo "Expected trusted publisher configuration:"
            echo "  package: $PKG_NAME"
            echo "  repository: ${{ github.repository }}"
            echo "  workflow: publish-packages.yml"
            echo "  environment: npm-publish"
            unset NODE_AUTH_TOKEN
            if ! npm publish --access public; then
              echo "::error::npm publish failed without NPM_TOKEN. Configure secrets.NPM_TOKEN or npm trusted publishing for publish-packages.yml."
              exit 1
            fi
          fi

      - name: Prepare GitHub package
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/prepare-github-package.cjs

      - name: Configure npm for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'

      - name: Publish to GitHub Packages
        working-directory: .github-package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          pkg="@${OWNER}/${PKG_NAME}"
          existing=$(npm view "$pkg" version --registry https://npm.pkg.github.com 2>/dev/null || true)
          if [ "$existing" = "$PKG_VERSION" ]; then
            echo "Version $PKG_VERSION already published to GitHub Packages. Skipping."
          else
            npm publish --ignore-scripts --access public
          fi
